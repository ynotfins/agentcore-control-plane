        - swarmclaw_sqlite_operational_state
        - swarmvault_corpus
      loopback_only: true
      cross_device_sync: deferred
    swarm_memory_pointer:
      - Neutral shared SwarmRecall is the cross-client semantic memory plane.
      - SwarmClaw native SQLite remains authority for transcripts, tasks, schedules, approvals, and working turn state.
      - SwarmVault remains Swarm-owned corpus/wiki/RAG.
    portable_context_engine:
      path: D:\github\agentcore-context-engine
      role: session_context_orchestration_above_agentcore_memory_and_neutral_recall
      does_not_replace: [cognee, pg18_evidence, langgraph_checkpoints, swarmclaw_sqlite, swarmrecall]
    permitted_developer_relationship:
      - A neutral dual workspace may be used for read-only collision and boundary audits only.
      - Read-only boundary-audit evidence may point to Swarm authority but must not become Swarm runtime input.
      - Former AgentCore IDE development-continuity-on-Swarm-projects language is historical and revoked (2026-07-31).
    shared_machine_collision_constraints:
      - AgentCore PG18, Bifrost, Cognee, and IDE gateway contracts remain AgentCore-exclusive.
      - SwarmClaw operational data and SwarmVault remain Swarm-exclusive.
      - Neutral Recall/PG16/Meili may be used by both clients with separately issued API keys.
      - Mutable Swarm runtime facts (except reclassified neutral Recall ownership) are owned by Swarm authority.
      - AgentCore hot namespace remains F:\AgentCore\...; Swarm hot operational data remains on H:; cold backups under E:\ with non-overlapping namespaces.
