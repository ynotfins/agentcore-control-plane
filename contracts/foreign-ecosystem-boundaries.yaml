    neutral_shared_swarmrecall:
      classification: machine_level_neutral_semantic_memory_plane
      not_owner: [agentcore_runtime, swarm_runtime]
      clients:
        - agentcore_memory_server_side_adapter_only
        - swarmclaw_bounded_rest_sdk_adapter
      owns:
        - curated_global_pool
        - isolated_project_pools
        - summaries_decisions_learnings_skills_relations_source_refs
