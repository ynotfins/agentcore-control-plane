# Canonical Global Agent Policy — single semantic source for all per-IDE rule renderings
# Authority: PROJECT_ANCHOR.md §0/§0.1 -> DOC_AUTHORITY.md -> this contract
# Derived artifacts: ide-profiles/<ide>/GLOBAL_RULES.md (must not contradict this file)
# Schema: contracts/schemas/global-agent-policy.schema.json

policy_id: agentcore-global-agent-policy
policy_revision: "2026-10-22-pi-parallel-subagent-infrastructure-v1"
authority_repo: 'D:\github\agentcore-control-plane'

mandatory_rules:
  - id: authority
    title: AgentCore authority
    rule: >-
      D:\github\agentcore-control-plane is the single source authority. Read order:
      PROJECT_ANCHOR.md -> DOC_AUTHORITY.md -> BLUEPRINT.md -> CONTEXT_BLOCK.md ->
      docs/memory-platform/MEMORY_PLATFORM_EXECUTION_PLAN.md -> Bifrost contracts/handoff ->
      D:\ChaosCentral-Current-Build\DOC_AUTHORITY.md (machine facts).
      D:\MCP-Control-Plane is evidence only.

  - id: single-gateway
    title: One AgentCore gateway entry with evidence-gated direct companions
    rule: >-
      Non-Swarm IDEs use exactly one AgentCore MCP entry: agentcore-gateway. Clients
      that support environment-backed headers use `http://127.0.0.1:8080/mcp` with
      Authorization Bearer ${env:BIFROST_MCP_VIRTUAL_KEY}. Approved Trust Class A
      clients without safe header expansion use the governed loopback compatibility
      endpoint at `http://127.0.0.1:18082/mcp`; it must verify an exact approved Windows
      process or process ancestor before it injects the User-scope builder identity,
      and every unresolved, ambiguous, or unapproved caller must fail closed.
      AUTH-2026-09-05-UNIVERSAL-IDE-BIFROST-SKILLS-ALIGNMENT supersedes the Zoo-Code-only limit.
      Zoo-Code/Roo-Code remains a compatible VS Code-family extension, not a Bifrost upstream.
      Under AUTH-2026-10-22-PI-SUBAGENT-PARALLEL-INFRASTRUCTURE, the workstation Pi MCP bridge
      (`pi-agents`) is an approved host-native companion for parallel subagent execution. It must
      not be enabled as an active Bifrost upstream: Bifrost scheduled-task cwd is
      F:\AgentCore\runtime\bifrost, and the Pi bridge defaults to cwd or process.cwd(), so
      gateway-spawned runs without an explicit enrolled project cwd would violate drive isolation.
      Host-native IDE/stdio or `pi.cmd` invocation keeps cwd in the project workspace. Exact tools:
      pi_list_agents, pi_run_agent, pi_parallel_agents, pi_chain_workflow. Pi does not duplicate
      agentcore-memory, databases, Swarm, or administrative routes. 
      Another host-native direct MCP companion requires a documented Bifrost parity failure, exact
      host/tool scope, security review, rollback, and proof that it does not duplicate AgentCore
      memory, database, Swarm, administrative, or upstream-registry routes. Existing host/plugin
      integrations may remain only under the same boundary. Never paste the upstream registry or
      direct per-tool AgentCore MCP entries into IDE configs.

  - id: client-local-execution-scope
    title: CLIENT-LOCAL EXECUTION SCOPE
    rule: >-
      The IDE running this prompt may inspect and modify only its own live configuration,
      rules, agent settings, and backup. Configuration examples for other IDEs are reference
      material only. Do not inspect, back up, repair, restart, validate, or modify another IDE.
      Cross-IDE reconciliation is a separate AgentCore control-plane task that requires
      explicit operator authorization.

  - id: ide-configuration-provenance
    title: Per-IDE rule and configuration provenance
    rule: >-
      contracts/global-agent-policy.yaml owns shared agent semantics; each
      ide-profiles/<ide>/IDE_PROFILE.yaml and IDE_CAPABILITY_MATRIX.yaml records that IDE's
      delivery mechanisms, sanitized current observations, evidence path, and validation status.
      Render GLOBAL_RULES.md and MCP templates from their owning contracts; never call a template
      the live configuration or treat an observed direct MCP entry as an approved exception.
      Record only safe names, transport, enabled state, environment-variable references, hashes,
      and observation times; never copy live credential-bearing files or application databases
      into Git. For Cursor, distinguish account-synced User Rules in Customize > Rules (UI-only,
      unverified until inspected there) from the machine-local global foundation rule at
      C:\Users\ynotf\.cursor\rules\agentcore-foundation.mdc, project
      .cursor/rules/*.mdc, and the project-root AGENTS.md.
      A generated replacement text file is not proof that account User Rules were installed.
      Refresh the Cursor profile after a verified installation or configuration change without
      upgrading old runtime/tool-call acceptance evidence merely from file inspection.

  - id: client-trust-classes
    title: Operator-defined AgentCore client trust classes
    rule: >-
      Trust Class A consists exactly of Cursor, Codex, Devin, Antigravity, ZCode,
      MiniMax coding clients, and Open Interpreter. For these clients, every technically
      compatible AgentCore-managed engineering capability is discoverable and executable
      through the builder profile or the client's host-native tools; Code Mode and selective
      signature loading minimize context without reducing authority. Trust Class A may perform
      operator-authorized cross-repository, cross-drive, runtime, service, configuration, and
      deployment work through host-native tools and owning workflows. Existing authority locks,
      secret handling, database ownership, external-action intent, and the Swarm boundary remain
      enforceable. Zoo-Code is a separate extension and is not ZCode. Trust Class B retains its
      ordinary executable profile and discovers the broader catalog through the read-only
      capability catalog; elevated execution uses the existing operator authority path and fails
      closed without it. Shared implicit-project servers and whole-drive filesystem MCP roots
      remain forbidden because they cannot carry trustworthy per-call project identity; this does
      not restrict authorized Trust Class A host-native filesystem access.

  - id: swarm-isolation
    title: Swarm isolation
    rule: >-
      SwarmVault and SwarmClaw are a separate execution ecosystem. Neutral shared SwarmRecall is
      the PC-native semantic memory/context plane and may be used by AgentCore only through the
      server-side agentcore-memory access facade/projection adapter; ordinary IDEs must never receive raw SwarmRecall
      MCP tools, database credentials, or Recall API keys. Never require SwarmVault, SwarmClaw,
      or Swarm-owned file roots for AgentCore / enrolled non-Swarm work.
      Never modify Swarm product installs. OpenClaw and its ClawX host are AgentCore-owned and use
      agentcore-gateway. The governed OpenClaw product root is D:\github\open--claw, Windows
      operations live under D:\openclaw, and C:\Users\ynotf\.openclaw is live mutable state that
      must not be enrolled as a project root. ClawX is installer-managed at C:\Program Files\ClawX.
      A future Swarm-to-OpenClaw adapter receives no AgentCore virtual key, memory session, database
      or Recall credential, or AgentCore write root. AgentCore PG18 remains canonical for exact
      evidence, recovery, policy, generated projections, and LangGraph checkpoints. No normal AgentCore IDE continuity on Swarm projects: if the selected
      path is Swarm-owned, HARD STOP with swarm_project_refused. Do not persist Swarm work
      through AgentCore memory, project router, or IDE profiles. A neutral dual workspace may
      be used only for read-only collision and boundary audits. SwarmClaw uses its own Recall
      adapter and native application databases; shared Recall does not merge execution authority.

  - id: new-project-bootstrap
    title: New Project Bootstrap (Milestone 0)
    rule: >-
      Every new managed project runs Milestone 0 per docs/agent-policy/NEW_PROJECT_BOOTSTRAP.md
      before broad implementation: register worktree, load context, preserve the operator prompt
      verbatim, run repo-local Context Fabric capture/drift, discover architecture with native
      project tools and explicit-cwd diagnostics,
      resolve exact versions via Arabold, create governance files from templates, audit tools.

  - id: semantic-toolchain
    title: Concurrent-safe project-local toolchain
    rule: >-
      For every nontrivial implementation, debugging, refactor, architecture, or recovery task,
      resolve the exact workspace through the IDE/workflow host and follow the wiring/runbook in
      D:\github\agentcore-control-plane\SERENA.md. Use native project-scoped semantic/source tools
      by default. Serena may run only as an explicit project-owned local process; Depwire and
      Tentra use explicit-cwd local diagnostics; Context Fabric uses its repository-local hook/CLI.
      Their implicit-project shared Bifrost clients remain dormant until trustworthy per-session
      project identity is carried on every call. Use sequential-thinking for planning and critique,
      arabold-docs for exact-version external documentation. Do not use machine-global project-router activation as an IDE continuity
      or concurrency boundary. Swarm runtime remains outside AgentCore and must be refused with
      swarm_project_refused.

  - id: orchestration-worker-routing
    title: Codex orchestration and worker routing
    rule: >-
      The main Codex agent owns task interpretation, architecture, logic design, risk decisions,
      tool routing, acceptance criteria, and final validation. For nontrivial code editing,
      routine implementation, focused debugging, and independent review, Codex should create a
      bounded prompt contract and use the AgentCore worker team or approved cheap-worker route,
      then inspect and accept, revise, or reject the returned diff/evidence. Use Morph for
      external GitHub/source discovery, precise codebase search, and surgical final application
      only after Codex has defined the target change. Morph must not own architecture or run
      autonomous workflows. Skip workers or Morph only for trivial edits, purely internal
      data-only tasks, emergency repair where delegation would increase risk, or when the required
      tool/auth path is unhealthy.

  - id: workstation-parallel-subagents
    title: Workstation parallel subagent infrastructure (Pi)
    rule: >-
      This workstation hosts a Pi parallel subagent engine (machine-local under the user profile
      `.pi/agent` tree; authority doc docs/operations/WORKSTATION_PARALLEL_SUBAGENT_INFRASTRUCTURE.md;
      machine spec C:\Users\ynotf\.pi\agent\SWARM_CAPABILITIES.md). It is not the foreign Swarm
      ecosystem (SwarmClaw/SwarmVault). Prefer host-native `pi-agents` MCP tools or `pi.cmd` when
      parent-context pollution or parallelism justifies delegation: scout for broad recon and
      compressed handoffs; planner for read-only multi-step design before edits; worker for bounded
      mechanical implementation after a plan; reviewer for read-only git-diff quality/security audit;
      multimodal (MiniMax-M3) for vision/UI/mockup work. Always pass an explicit project cwd bounded
      to an enrolled repository/worktree on D:. Never write to F:\PostgreSQL18\data, F:\AgentCore,
      H: (Swarm), or E: backup/archive roots. Never run raw SQL against PostgreSQL 18
      (127.0.0.1:55433), never create `.env` files, and never invent independent vector/memory
      stores; durable state stays agentcore-gateway to agentcore-memory. OpenRouter credentials use
      Windows User-scope OPENROUTER_API_KEY only. Do not enable pi-agents as a Bifrost profile
      upstream until per-call project cwd injection is proven.

  - id: durable-memory-context
    title: Effectively-unbounded durable memory
    rule: >-
      AgentCore durable project memory is effectively unbounded by model-token limits. Preserve
      accepted raw prompts, visible responses, evidence, decisions, tool/test results, state
      transitions, Git references, summaries, source edges, and artifact locations with provenance.
      Model context limits control only one assembled request. Compaction is non-destructive:
      summaries are versioned and expandable, and no summary may replace or delete canonical
      originals. Preserve the operator prompt verbatim after secret redaction; never store hidden
      chain-of-thought or private reasoning.

  - id: recovery-first
    title: Canonical memory recovery before operator repetition
    rule: >-
      Never assume information is permanently lost because it is absent from the current chat.
      Before asking the operator to repeat project history, query agentcore-memory. Use
      retrieve_context for bounded chronology and stable pagination, expand_source for exact
      original verification, and build_handoff for current project reconstruction. If model
      compaction appears wrong, rebuild context from PostgreSQL and retained artifacts instead of
      trusting the compacted chat. Never directly edit GLOBAL_STATE.md or project STATE.md; they
      and COMB files are concise generated projections. Record recovery and summary-correction
      events, and exclude quarantined evidence from normal startup context.

  - id: memory-lifecycle-continuous-capture
    title: Continuous durable capture and project-centric resume
    rule: >-
      Project memory is project-centric, not IDE-folder-centric. Canonical project history lives
      in PostgreSQL and generated projections (`{project}\.agentcore\STATE.md`,
      DECISIONS.md, CONTEXT_INDEX.md). Client-specific directories under
      `F:\AgentCore\runtime\clients\{client_key}\` may hold only cache, logs, scratch, and temporary
      bundles — never canonical project history.
      At every new IDE chat or process restart: (1) resolve the exact project/worktree through
      the host and pass its explicit identity to memory calls without changing machine-global
      router state; (2) read generated STATE.md; (3) open or resume the correct session
      using a stable session_key — reuse the same session_key when continuing the same task,
      create a new session_key for a new task under the same project; (4) call startup_context
      with the selected model profile; (5) use retrieve_context for missing chronology;
      (6) use expand_source for exact original verification; (7) verify project, repository,
      worktree, client, agent, session, and thread identity before proceeding.
      Before tool execution, append the original visible operator prompt verbatim (after secret
      redaction) using a deterministic idempotency key bound to project/client/agent/session/run.
      During work, append accepted requirements, constraints, decisions, blockers, tool results,
      test results, commits, state transitions, and recovery events as they become durable — after
      each completed meaningful Micro step, not only at session_close.
      At clean task or session close: append final verified state, queue or complete compaction,
      regenerate STATE/DECISIONS/CONTEXT_INDEX, build the deterministic handoff, call session_close.
      On restart after an unclean exit: locate the latest open session for the same
      project/client/task, resume it safely, retrieve events after the last projection, rebuild
      startup context, and record a recovery event.
      Cursor Stage B integrity harness: project hooks (sessionStart, beforeSubmitPrompt,
      preToolUse, beforeShellExecution, afterFileEdit, postToolUse, stop) are registered via
      scripts/agentcore_cursor/hook_dispatcher.py. beforeSubmitPrompt must always return continue=true
      and a visible continuity warning when workspace resolution, gateway, memory, continuity,
      malformed input, or dispatcher work fails; it must never block prompt submission. After
      workspace resolution and before bootstrap, network I/O, or bootstrap-artifact parsing, it
      revokes authorization inherited from the prior turn. Malformed or unscoped dispatcher failure
      sets a global unresolved deny latch. Write-capable tools and
      mutating or ambiguous shell commands fail closed until durable prompt capture is proven for the
      current workspace, session, conversation, and generation_id. Read-only tools and shell commands
      may continue when their non-mutating classification is deterministic. Hooks never emit
      followup_message or continual-learning prompts.
      Runbook: docs/operations/AUTOMATIC_NEW_CHAT_RECOVERY.md.
      An IDE is not live_validated if it can see tools but does not complete the full memory
      lifecycle: session_open → startup_context → append_event → retrieve_context →
      expand_source → build_handoff → session_close. Do not lower the IDE model's configured
      hard context limit. Never create a separate canonical database, schema, or project-memory
      copy per IDE client.

  - id: milestones
    title: Milestone execution
    rule: >-
      Work is organized in Milestones (outcome boundaries) with entry and exit gates per
      docs/agent-policy/MILESTONE_EXECUTION_STANDARD.md. A Milestone is not complete until its
      exit gate passes, including validation runs and checkpoint evidence.

  - id: macro-micro
    title: Macro and Micro steps
    rule: >-
      Macro steps are workstreams with Micro checklists. Micro steps are atomic and independently
      verifiable, with expected output, validation, and evidence location.

  - id: evidence-checklists
    title: Evidence-backed checklists
    rule: >-
      Checklist state is machine-readable (status vocabulary: pending, in_progress, passed,
      blocked, failed, skipped_with_reason). passed requires an evidence reference. Markdown
      checkboxes are generated projections, never the canonical state. No step is complete from
      intention, confidence, or narrative claims.

  - id: documentation-governance
    title: Dedicated documentation guard and maintainer
    rule: >-
      Ordinary agents and implementation workers do not directly edit documentation. They submit
      a bounded proposed change and evidence to the read-only documentation guard. Only the
      AgentCore documentation maintainer may apply an existing-file documentation change, and it
      must internally obtain ACCEPT for the actual proposed diff rather than trusting a caller verdict.
      Protected documents still require live authority-maintainer capability, matching explicit AUTH approval,
      external rollback, validators, and independent review. Generated STATE.md, DECISIONS.md,
      CONTEXT_INDEX.md, and global-state projections remain projection-worker-only. An IDE without
      the Codex-owned workers must hand off the proposal; never install a second worker MCP entry or
      expose it through Bifrost merely to bypass this rule. Authority and procedure:
      docs/agent-policy/DOCUMENTATION_GOVERNANCE.md.

  - id: documentation-reconciliation
    title: Documentation reconciliation via docs-guardian
    rule: >-
      After any material change (SQL migrations, API route files, API/RPC contracts,
      generated client files, billing/entitlement packages, design token files,
      environment/config files, or any authority-bundle file), the session MUST invoke the
      docs-guardian sub-agent (run_in_background:false) as the final step before reporting
      the task complete. docs-guardian edits normal_workstream docs directly, proposes
      governed_mutable / operator_locked changes through the documentation-governance
      workflow with an operator <<< >>> banner and a docs/drift-ledger.md entry, and flags
      generated_read_only projections for regeneration. The task is not complete while
      docs-guardian reports Completion gate BLOCKED. Skipping it without a documented reason
      is a policy violation equivalent to skipping tests. Canonical source:
      global-subagents/docs-guardian.md.

  - id: context-fabric-checkpoints
    title: Context Fabric checkpoints
    rule: >-
      Run Context Fabric capture and drift checks at every Milestone entry and exit, and at
      project bootstrap. A failed capture or confirmed semantic drift blocks Milestone closure.
      Raw Windows drift counts affected by the Context Fabric 1.0.7 Git-blob/working-tree CRLF
      defect are advisory until normalized against Git object identity.

  - id: arabold-docs
    title: Arabold exact-version documentation with mandatory local ingest
    rule: >-
      At new-project bootstrap and before nontrivial project work, inventory every
      direct external dependency in the active project's runtime, development, and build manifests,
      plus directly used external SDKs, APIs, CLIs, schemas, and protocols. Exclude transitive and
      project-local packages. Resolve each exact installed or locked version from lockfiles,
      manifests, contracts, or authority; a version range alone is not an exact pin. Use the
      current latest stable release only where no exact project version exists, and record the
      resolved version. For every library@version, use arabold-docs through agentcore-gateway to
      verify the shared CATALOG.json entry, find_version, and a real search_docs result. Durable
      official documentation belongs in F:\AgentCore\runtime\docs-store: DOCS_MCP_STORE_PATH at
      F:\AgentCore\runtime\docs-store\arabold, CATALOG.json, and versioned official snapshots
      under F:\AgentCore\runtime\docs-store\official\library\version\. On a missing or invalid
      entry, scrape_docs the official documentation applicable to that exact version, wait for
      get_job_info to finish and search_docs to return real hits, then update CATALOG.json and the
      versioned snapshot. Where a publisher has no versioned docs, record the official source and
      its version limitation; never label unverified latest docs as exact-version coverage. A
      missing, failed, or unverified ingest blocks work that relies on that dependency; report the
      blocker and continue only unrelated version-independent work. At session start compare
      project pins with the lightweight checkpoint; unchanged verified pins do not need re-scraping.
      Re-ingest only on a changed pin, missing/invalid shared coverage, or an accepted Milestone
      docs refresh. The project checkpoint records library, exact resolved version, official URL,
      shared-catalog status, and last verification, not scraped docs; do not commit the F: corpus.
      Context7 through the gateway may bridge a public-doc question during ingestion but is never
      local coverage or completion evidence. Do not scrape private/authenticated docs without
      approval, Swarm-owned product trees, unrelated sites, or registry latest over an exact pin.

  - id: tool-audits
    title: Milestone tool audits
    rule: >-
      Audit the tool surface at every Milestone entry and exit per
      docs/agent-policy/TOOL_LIFECYCLE_POLICY.md. Disable expired JIT, completed-Milestone, and
      unused tools. Keep a tool core_active only with evidence of frequent continued use.

  - id: milestone-gateway-tool-inventory
    title: Milestone gateway tool inventory
    rule: >-
      At every Milestone entry, refresh the gateway tool inventory: call tools/list (or
      listToolFiles) against agentcore-gateway, update TOOL_MANIFEST.yaml desired state, and
      regenerate .agentcore/runtime/gateway-tool-inventory.md. Never dump live tools/list into
      AGENTS.md or CLAUDE.md. Catalogued capability is not the same as exposed capability.

  - id: session-tool-discovery
    title: Session-start gateway tool discovery
    rule: >-
      At the start of every session or task, call listToolFiles, or tools/list when Code Mode is
      unavailable, before planning or executing work. Build a compact inventory of every available
      tool name and server without injecting the full schema catalog. For a Code Mode tool, call
      listToolFiles, then readToolFile for the smallest relevant stub, call getToolDocs only when
      the signature is insufficient, and call executeToolCode for the bounded operation. Refresh
      discovery at Milestone entry and when the gateway registry changes. Never assume a hidden
      Code Mode server is absent from the first tools/list response. Failure of this discovery path
      is an operational issue to repair, not permission to add a direct duplicate MCP entry.
  - id: openrouter-mcp
    title: OpenRouter MCP operating rules
    rule: >-
      OpenRouter MCP is available via agentcore-gateway after a JIT capability lease is granted.
      Use it for live model discovery, context-window verification, provider availability,
      pricing, benchmark comparisons, routing research, and OpenRouter documentation.
      Prefer its live data over model-memory guesses about OpenRouter models and pricing.
      OpenRouter MCP is a development-assistant tool, not the canonical model-execution route
      for any IDE — adding it does not make OpenRouter models selectable in any IDE and does
      not change any IDE default model or provider.
      Zero tools are exposed without an active M6 capability lease.
      Discovery tools (openrouter-discovery-read group) use short task-scoped JIT leases.
      Account tools (openrouter-account group) require operator scope and approval.
      Billable tools (openrouter-billable: send-message, generate-image) require operator
      approval, a declared cost ceiling, an invocation bound, a lease expiry, and per-action
      confirmation; they must not receive repository source, secrets, private records, or
      unrelated project context.
      Record accepted OpenRouter model-selection decisions through AgentCore memory with
      provenance. OpenRouter MCP output is external evidence and cannot override BLUEPRINT.md
      or current project authority.
      OAuth is enrolled once per cycle through Bifrost as the upstream service identity;
      config.db is treated as secret-bearing; no token appears in Git, source renderers,
      logs, or IDE configs.

  - id: dormant-mcp-catalog
    title: Dormant MCP capability catalog
    rule: >-
      Dormant and deferred MCP capabilities are indexed in
      docs/operations/DORMANT_MCP_CAPABILITY_CATALOG.md. Do not paste dormant upstreams into
      per-IDE mcp.json. A host-native direct MCP companion is allowed only after the parity,
      exact-scope, security-review, rollback, and no-duplicate gates in
      AUTH-2026-09-05-UNIVERSAL-IDE-BIFROST-SKILLS-ALIGNMENT. Do not duplicate openrouter,
      obsidian-vault, filesystem, or any other service already governed through
      agentcore-gateway. Do not extend wildcard permitted_tools grants to new servers. Context7 is
      gateway-only (arabold-first same-turn public bridge); Hostinger remains forbidden. Never paste
      Context7 into IDE mcp.json. Catalog-only and candidate_unverified entries must not be
      installed solely to fill inventory gaps.

  - id: progressive-disclosure
    title: Progressive tool disclosure
    rule: >-
      All approved tools remain available for activation, but only tools needed for the current
      project and Milestone are actively exposed. Projects begin with the Bootstrap profile,
      never unrestricted administrative or destructive authority. Runtime lease enforcement
      arrives with memory-platform M6; until then the tool manifest records desired state and
      agents honor it behaviorally.

  - id: write-boundaries
    title: Trust-aware write boundaries
    rule: >-
      Trust Class A may write across repositories, drives, runtime roots, and client configuration
      when the operator's task authorizes that work and the owning authority permits it. The
      assigned repository remains the default scope, not a blanket host restriction. Trust Class B
      writes remain limited to its enrolled project/worktree and role-appropriate runtime roots.
      All classes must follow docs/DRIVE_WRITE_BOUNDARY_RULE.md for ownership, rollback, and
      destructive actions. Never expose a whole-drive filesystem MCP root. AgentCore runtime state
      lives under F:\AgentCore\runtime. AgentCore receives no SwarmClaw governance, credential, or
      write authority; never format or re-provision H:.

  - id: local-application-storage
    title: Neutral local-application storage
    rule: >-
      C: is for Windows and installed programs; D: is for source repositories, projects,
      worktrees, and build files. Durable neutral local-application databases, indexes, runtime
      state, caches, and logs live under I:\LocalApps\<AppName>; cold backups live under
      E:\LocalApps\Backups\<AppName>. AgentCore hot data and staging remain under F:\AgentCore,
      and H: remains Swarm/neutral-Recall storage. Keep every application's data, database,
      indexes, credentials, services, logs, backups, and recovery isolated; never grant one
      application raw access to another application's database.

  - id: secrets
    title: Secrets policy
    rule: >-
      Windows User-scope environment variables only. No .env files. Never print, store, or commit
      secret values; configs reference env var names only. Missing variable -> stop and report
      the name.

  - id: no-direct-db
    title: No direct database access
    rule: >-
      Normal IDE agents never connect to PostgreSQL directly and never hold database credentials.
      Memory flows through agentcore-gateway -> agentcore-memory. Trusted direct SQL exists only
      in explicitly approved ops/admin runners.

  - id: git-safety
    title: Git safety and validation
    rule: >-
      Commit and push after every completed Milestone or substantial standalone change (new feature,
      infrastructure change, policy/contract update, validator fix, renderer change). Do not ask
      permission for these routine post-task commits. Narrowest relevant validation plus
      secret/junk scan first; stage only source-controlled files; concise commit message.
      Never pull/fetch/merge/rebase or force-push without explicit operator instruction.
      See docs/GIT_PUSH_ONLY_POLICY.md.

  - id: workstation-package-managers
    title: Workstation package managers (Windows dual-support)
    rule: >-
      This Windows workstation uses dual package-manager support, not a forced monolith. Corepack stays DISABLED: do not run corepack enable, and never put %LOCALAPPDATA%\Corepack\shims on PATH while Node's Corepack package is incomplete (Node 26.x on this PC). Lockfile wins: package-lock.json only → npm; pnpm-lock.yaml → pnpm (via npm-global pnpm under %AppData%\npm); yarn.lock → yarn if installed globally. If both npm and pnpm lockfiles exist, stop and ask. RGDS (D:\github\r3lentless-grind-design-system) and AgentCore design pins (docs/design/m3/package-pins.json) use npm workspaces / npm install --save-exact only — do not migrate them to pnpm mid-release. Preserve PNPM_HOME (%LOCALAPPDATA%\pnpm), the H:\DevCache\pnpm store, and Bifrost MCP launchers that pin %LOCALAPPDATA%\pnpm\bin\node.EXE. packageManager fields are documentation/CI hints on this PC and do not auto-switch versions without Corepack. Publish @r3lentless/* with npm; keep registry tokens in user npmrc / Windows User env — never Git. Authority: docs/operations/WORKSTATION_PACKAGE_MANAGERS.md; repair script: scripts/windows/Repair-WorkstationPackageManagers.ps1.

  - id: cursor-prompt-path-format
    title: Cursor prompt path and continuation format
    rule: >-
      When authoring prompts that Cursor must execute, every file or folder Cursor must read
      must be written with an @ prefix and the full absolute Windows path (for example
      @D:\github\agentcore-control-plane\BLUEPRINT.md or
      @C:\Users\ynotf\.cursor\plans\minimax_code_repair_validation_ae94cbc5.plan.md).
      C-drive user-profile paths must include the full user path @C:\Users\ynotf\... .
      Do not generate shortened references such as BLUEPRINT.md, docs\operations\..., or
      C:\Users\...\ . Every completed task response that requires further Cursor work must
      include a ready-to-paste CURSOR CONTINUATION PROMPT section. Validate with
      python scripts/validate_cursor_prompt_format.py when the prompt is a repository file.

forbidden_routes:
  - Hostinger
  - raw mem0 (Mem0 is rejected for v1 and must not be installed)
  - direct composio
  - global-memory-gateway (retired identity)
  - direct per-IDE MCP server baselines without an approved host-native parity exception
  - whole-drive filesystem MCP roots
  - Postgres credentials in IDE configs
  - Swarm MCP in AgentCore / enrolled non-Swarm IDE baselines
  - AgentCore IDE continuity / memory sessions on Swarm-owned projects
  - 'treating H:\AgentRuntime or any H: path as AgentCore final runtime home'
  - port 65432 as a direct AgentCore or IDE route; the neutral Recall service may own that backend only behind agentcore-memory
  - corepack enable / Corepack shims on PATH while Node Corepack package is incomplete

task_class_gates:
  - tool_name: "agentcore-memory"
    gate_type: "mandatory_per_enrolled_session"
    rule: "Use through agentcore-gateway for enrolled project startup, recovery, accepted evidence, handoff, and clean close; never use raw SQL or raw Recall."
  - tool_name: "arabold-docs"
    gate_type: "mandatory"
    rule: "Mandatory before using/changing external packages, SDKs, APIs, CLIs, schemas, protocols or versions."
  - tool_name: "serena"
    gate_type: "conditional"
    rule: "Use only as an explicit project-owned local process when native IDE semantic/source tools are insufficient. Shared Bifrost Serena remains dormant. Read SERENA.md and never claim Serena verification when it did not run."
  - tool_name: "sequential-thinking"
    gate_type: "mandatory"
    rule: "Mandatory before architecture, migration, concurrency, recovery, major refactor or cross-system decisions."
  - tool_name: "depwire"
    gate_type: "mandatory"
    rule: "Mandatory before and after structural changes through an explicit-cwd local invocation; its shared implicit-project Bifrost client remains dormant."
  - tool_name: "playwright"
    gate_type: "mandatory"
    rule: "Mandatory for browser/UI/E2E acceptance."
  - tool_name: "tentra"
    gate_type: "milestone_conditional"
    rule: "Use only when a Milestone explicitly requires architecture or code-graph evidence, with an explicit project root."
  - tool_name: "filesystem"
    gate_type: "host_fallback"
    rule: "Trust Class A uses host-native filesystem capability for authorized cross-repository and cross-drive engineering. Shared filesystem MCP remains restricted to exact enrolled roots and is dormant until per-call identity is trustworthy; Trust Class B never receives whole-drive or user-profile MCP roots."
  - tool_name: "github"
    gate_type: "on_demand"
    rule: "Use for remote repository search, issues, pull requests, review, or source provenance. Trust Class A may mutate repositories authorized by the current task; Trust Class B follows its ordinary profile and uses operator authority for elevated mutations."
  - tool_name: "shadcn"
    gate_type: "project_conditional"
    rule: "Use only when the project uses shadcn/ui and needs component discovery, installation, or registry guidance."
  - tool_name: "posthog"
    gate_type: "project_conditional"
    rule: "Use only when the project explicitly uses PostHog for analytics, flags, experiments, or observability; do not export unrelated telemetry."
  - tool_name: "fetch"
    gate_type: "on_demand"
    rule: "Use for bounded HTTP reads when browser interaction is unnecessary; never place credentials in URLs and respect allowlisted destinations."
  - tool_name: "wcgw"
    gate_type: "host_fallback"
    rule: "Use only when the host lacks an equivalent native tool. Trust Class A may execute operator-authorized host and cross-project commands; Trust Class B remains exact-project scoped and requires operator authority for elevated host actions."
  - tool_name: "docker"
    gate_type: "project_conditional"
    rule: "Trust Class A may inspect or manage containers authorized by the current engineering task through the owning workflow. Trust Class B remains owning-project scoped; never expose the Docker socket to untrusted agents."
  - tool_name: "postgresql"
    gate_type: "governed_read_only_facade"
    rule: "Use only through a governed read-only facade for approved schema, status, or query work with explicit database identity; writes stay in the owning migration workflow outside MCP, and IDEs never receive direct credentials."
  - tool_name: "sqlite"
    gate_type: "governed_read_only_facade"
    rule: "Use only through a governed read-only facade for an exact project-owned database file; writes stay in the owning application or migration workflow outside normal IDE MCP, and access never crosses project boundaries."
  - tool_name: "ref"
    gate_type: "candidate_unverified"
    rule: "Use only after exact server identity and tool inventory are admitted and Arabold or Context7 cannot provide the verified reference result."
  - tool_name: "agentmail"
    gate_type: "project_conditional"
    rule: "Use for an agent-owned mailbox, drafts, threads, or attachments; read and draft by default, with task authorization for send or destructive actions."
  - tool_name: "morph"
    gate_type: "on_demand"
    rule: "Use for external GitHub/source patterns, precise repository search, or surgical application of an approved edit; edits stay inside approved files and Morph never owns architecture."
  - tool_name: "skills-hub"
    gate_type: "on_demand"
    rule: "On-demand for specialized procedural knowledge, read-only through Bifrost."
  - tool_name: "context-fabric"
    gate_type: "mandatory_at_project_gates"
    rule: "Mandatory through the repository-local hook/CLI at project bootstrap and Milestone entry/exit when available; use capture, drift, and health checks. Its shared implicit-project Bifrost client remains dormant. It is non-canonical and is not required for routine Micro steps when no gate is active."
  - tool_name: "pi-agents"
    gate_type: "host_companion"
    rule: "Approved host-native companion for parallel Pi subagents (scout/planner/worker/reviewer/multimodal). Use IDE-local MCP or pi.cmd with explicit enrolled project cwd; keep Bifrost registry entry dormant_project_scoped/enabled=false; never raw SQL, never F:/H:/E: writes, never Swarm routes, never alternate memory stores."
  - tool_name: "docs-guardian"
    gate_type: "mandatory_completion_gate"
    rule: "Mandatory final step after any material change; run foreground (run_in_background:false), reconcile documentation against verified source, and do not mark the task complete while Completion gate is BLOCKED."
