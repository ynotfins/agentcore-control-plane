known_limitations:
- OpenCode uses headerless process-attested access via :18082; exact Windows process ancestry must resolve to
  %APPDATA%\npm\node_modules\opencode-ai\bin\opencode.exe.
- Preserve singleton provider schema (provider + enabled_providers). DeepInfra base URL must remain
  https://api.deepinfra.com/v1/openai; LM Studio http://127.0.0.1:1234/v1.
- A prior truncated or credential-bearing AgentCore MCP entry is legacy drift and must not be restored.
semantic_parity_gaps:
