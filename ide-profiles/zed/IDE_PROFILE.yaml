known_limitations:
- Zed uses headerless Trust Class A via :18082; exact Windows process ancestry must resolve to
  %LOCALAPPDATA%\Programs\Zed\Zed.exe.
- Zed Agent, External Agents, and Terminal Threads have distinct configuration boundaries; only context_servers
  agentcore-gateway is the approved AgentCore route.
- A prior credential-bearing live gateway entry is legacy drift and must not be restored.
semantic_parity_gaps:
- Native AgentCore lifecycle hooks or a signed Context Engine adapter are not yet certified for Zed.
