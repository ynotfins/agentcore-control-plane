ide_id: reasonix
display_name: Reasonix (DeepSeek-native terminal coding agent)
swarm_managed: false
installed_version: pnpm add -g reasonix@next (Go static binary via npm wrapper; latest @next pin)
live_global_rule_target: F:\AgentCore\agents_workspace\Reasonix\REASONIX.md
live_mcp_config_target: F:\AgentCore\agents_workspace\Reasonix\reasonix.toml
rule_mechanism: REASONIX.md (Context Engine v2) + AGENTS.md / CLAUDE.md fallback (deepest directory wins; imports with cycle detection; @-relative imports)
mcp_schema: reasonix_toml
mcp_transport: stdio (Reasonix MCP client supports stdio + SSE; HTTP via mcp-remote bridge)
env_var_handling: bearer_token_env_var (Bearer via env var; no inline expansion in toml)
restart_behavior: restart reasonix session after reasonix.toml or env-var changes
editability:
  global_rules: direct_write
  project_rules: direct_write
  mcp_config: direct_write
installation_mode: install_script
backup_required: true
validation_required: true
restart_required: true
last_validation_date: '2026-08-04'
mcp_template_source: renderers/gateway-clients/reasonix.json
known_limitations:
- 'Reasonix MCP transport is stdio + SSE; HTTP MCP upstreams (Bifrost, Hindsight) require an mcp-remote stdio-to-HTTP bridge or npx shim.'
- 'Reasonix ships a Wails desktop client as a prerelease. Use the CLI (reasonix / dsnix) for stability; the desktop shell is opt-in.'
- 'Reasonix context files use REASONIX.md first, then AGENTS.md / CLAUDE.md. Stand down any duplicate AGENTS.md for this IDE profile.'
- 'Stale .reasonix-activate.lock from prior desktop crashes can wedge the launcher. Clear via reasonix-cli.exe doctor repair or by removing the lock file under %LOCALAPPDATA%\Programs\Reasonix\ before first launch.'
- 'Hindsight is the memory backend; consume via Bifrost agentcore-gateway MCP, not as a direct MCP entry in reasonix.toml.'
semantic_parity_gaps:
  - 'Reasonix lacks an autonomous /goal equivalent. Plan mode exists; long-horizon autonomous loops should be paired with Hindsight reflect + observation consolidation.'
  - 'Reasonix repo-map is tree-sitter-based and prompt-time only. For persistent AST ranking, register the RepoMap MCP server (or Hindsight graph entity traversal) via Bifrost as a tool, not by replacing Reasonix internal index.'
