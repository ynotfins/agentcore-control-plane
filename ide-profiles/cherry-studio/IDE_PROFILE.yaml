known_limitations:
- Cherry Studio has no approved environment-backed header expansion or process-attested AgentCore route. Repository
  templates intentionally contain no active AgentCore gateway entry.
- A prior Cherry Studio LevelDB enrollment was validated in July 2026 using a materialized credential. That state
  is legacy drift, not an approved current enrollment instruction; this task does not inspect or mutate it.
- Cherry persists MCP servers in Local Storage LevelDB under redux key persist:cherry-studio; no simple file edit.
- Cherry Global Memory must be OFF; builtin @cherry/* inMemory MCP servers must remain inactive.
- Rules are delivered through the AgentCore Workspace Agent system prompt, not a file-based global rule.
- DRIFT-01 UI session-create failure during Bifrost-down windows is not a missing-agent defect; native UI 14-step
  still operator-gated (see Phase 4C audit).
semantic_parity_gaps:
- Rule delivery depends on the operator/agent running scripts/cherry/configure_agentcore_agent.py to import the
  canonical AgentCore Workspace Agent prompt.
