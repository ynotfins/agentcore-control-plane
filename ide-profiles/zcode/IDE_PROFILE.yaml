known_limitations:
- ZCode uses headerless Trust Class A via :18082; exact Windows process ancestry must resolve to
  C:\Program Files\ZCode\ZCode.exe.
- ZCode is distinct from Zoo-Code/Roo-Code (VS Code-family extension); never merge their profiles.
- Signed memory writes go through the host signer (scripts/agentcore_zcode/signed_memory.py);
  the in-session MCP client cannot mint device assertions in-process (same pattern as Devin).
semantic_parity_gaps:
- In-session device-assertion injection is a manual sign-then-call pattern via the host signer;
  not yet automated inside the ZCode client.
