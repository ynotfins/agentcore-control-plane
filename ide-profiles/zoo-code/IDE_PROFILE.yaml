- Bifrost/agentcore-gateway is MCP/tooling only for Zoo Code; it must not be treated as the host for Zoo Code's UI, agent side panel, provider account, or model execution.
- Zoo Code is not installed as a Zed extension; Zed uses its own native AgentCore MCP configuration instead.
- Zoo Code skills are installed globally at C:\Users\ynotf\.roo\skills because upstream Zoo Code scans .roo/skills after .agents/skills and gives it higher same-source priority.
