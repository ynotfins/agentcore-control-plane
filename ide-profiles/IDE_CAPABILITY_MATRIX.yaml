# IDE Capability Matrix — managed clients and rule/MCP delivery capabilities
# Source facts: ide-profiles/<ide>/IDE_PROFILE.yaml (this file is the cross-IDE summary).
# Editability modes: direct_write | generated_prompt | manual_import | UI_only | unsupported | unverified
# Configuration mode summary: the normal way this client receives its AgentCore baseline.
# Do not guess values — 'unverified' until evidence exists.

matrix_revision: '2026-09-14-cursor-configuration-provenance'
policy_source: contracts/global-agent-policy.yaml
model_context_profile_source: contracts/model-context-profiles.json
self_enrollment_contract:
  session_open: Each managed client opens/resumes its project session with verified client identity, repository/worktree/Git
    identity, selected provider/model identity, and a named context profile. Unknown models use standard-context only as a
    safe fallback; the IDE's configured hard context window is never lowered.
  startup_context: Request the selected model profile and load the smallest high-signal active packet. A 4096 token budget
    is acceptance/legacy-only, never the production default or durable-memory cap.
  recovery: If local conversational context is missing or suspect, call retrieve_context with a recovery mode and stable pagination,
    expand_source for exact originals, and build_handoff for current project reconstruction before asking the operator to
    repeat history.
direct_mcp_companion_policy:
  status: evidence_gated
  requirements:
  - documented Bifrost parity failure
  - exact host and tool scope
  - security review
  - rollback proof
  - proof of no duplication of AgentCore memory, database, Swarm, administrative, or upstream-registry routes
  historical_approvals:
    zoo-code:
      approval: AUTH-2026-08-20-ZOO_CODE_DIRECT_MCP_EXCEPTION
      status: subject_to_current_policy
      note: Historical approval is not a blanket or sole active exception; current evidence-gated requirements apply.
enrollment_status_codes:
  live_validated: MCP verified, tools confirmed, identity isolated, rolling context proven live
  configured_restart_required: Config written to live path; IDE/session restart required to activate
  awaiting_operator_import: Artifact generated; operator must install per INSTALL_OR_UPDATE.md and restart
  awaiting_operator_cloud_mcp_enrollment: Operator must enroll via product's cloud MCP UI/API
  unsupported_with_reason: Product does not support required MCP baseline (see notes)
certification_status_codes:
  source_ready: Repository source and adapter contract validate; no installation claim
  installed_unverified: Installed bytes hash-match canonical source; native discovery is not yet proven
  configured_restart_required: Configuration is present and validated; restart or fresh task remains
  live_validated: Host-native gateway, Code Mode, memory lifecycle, and persistence acceptance passed
  manual_import_pending: A generated artifact requires operator import
  UI_only_pending: Product configuration is UI-only and has not completed native acceptance
  unverified: Required host behavior, path, or evidence is unresolved
  unsupported_with_reason: Host cannot satisfy the contract for a recorded reason
