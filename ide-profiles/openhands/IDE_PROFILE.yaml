ide_id: openhands
display_name: OpenHands (Agent Canvas, Docker)
swarm_managed: false
installed_version: ghcr.io/openhands/agent-canvas:1.13.0
live_global_rule_target: I:\LocalApps\OpenHands\state (agent skills)
live_mcp_config_target: I:\LocalApps\OpenHands\state\settings.json
rule_mechanism: OpenHands agent settings and repository microagents
mcp_schema: openhands_settings_json
mcp_transport: http
env_var_handling: Container receives its per-app key BIFROST_MCP_VK_APP_OPENHANDS from Windows User env via docker-compose; settings.json
  must not store a literal bearer
gateway_url: http://host.docker.internal:8080/mcp
gateway_auth_mode: env_header
restart_behavior: restart client after MCP or provider config changes
editability:
  global_rules: manual_import
  project_rules: unverified
  mcp_config: direct_write
installation_mode: generated_prompt
backup_required: true
validation_required: true
restart_required: true
last_validation_date: '2026-11-15'
mcp_template_source: ide-profiles/openhands/MCP_CONFIG_TEMPLATE.json
known_limitations:
- Registered Trust Class A on 2026-11-15 by operator decision; caller identity resolves to docker container openhands-local-8003.
- Database access only through agentcore-gateway -> agentcore-memory; no direct PostgreSQL MCP or credentials.
- Model inference routes through OmniRoute loopback http://127.0.0.1:20128/v1 (separate plane from MCP); provider
  secrets stay in Windows User env.
semantic_parity_gaps:
- Signed automatic AgentCore lifecycle capture is not yet certified for OpenHands (Agent Canvas, Docker).
