# IDE profile: source-controlled facts for this managed client.
# Do not guess values. Use 'unverified' until evidence exists.

ide_id: openhands
display_name: OpenHands (Agent Canvas GUI + CLI)
swarm_managed: false
trust_class_requested: A   # highest tier; pending Tony's acceptance of governance/proposals/2026-11-15-openhands-trust-class-a.md
installed_version: 'openhands-agent-server 1.59.0, openhands-sdk 1.59.0, openhands-automation 1.26.1 (uvx, observed 2026-11-15)'
runtime_ports:
  agent_server: 127.0.0.1:18000
  automation: 127.0.0.1:18001
live_settings_target: C:\Users\ynotf\.openhands\settings.json
live_llm_profiles_dir: C:\Users\ynotf\.openhands\profiles
live_agent_profile: C:\Users\ynotf\.openhands\agent-profiles\default.json
live_cli_config: C:\Users\ynotf\.openhands\config.toml
live_skills_dir: C:\Users\ynotf\.openhands\skills
live_mcp_config_target: settings.json -> agent_settings.mcp_config.agentcore-gateway
mcp_schema: openhands_settings_mcp_config
mcp_transport: http (streamable)
gateway_url: http://127.0.0.1:8080/mcp
gateway_auth_mode: bearer_encrypted_in_app_settings   # value entered from BIFROST_MCP_VK_APP_OPENHANDS via the OpenHands UI; the app stores it Fernet-encrypted
capability_profile: builder
tool_surface: progressive Code Mode (27 eager tools on 2026-11-15; listToolFiles -> readToolFile -> getToolDocs -> executeToolCode)
llm_route:
  provider: OmniRoute (local, loopback)
  base_url: http://127.0.0.1:20128/v1
  api_key_ref: os.environ/OMNIROUTE_API_KEY
  default_profile: omniroute-default        # model openai/default (OmniRoute combo "default")
  extra_profiles: [omniroute-sol-kie-heavy, omniroute-agent-glm, omniroute-review]
  codex_in_omniroute: forbidden
approvals:
  confirmation_mode: false                  # Tony t321u: auto-approve everything incl. terminal
  cli_security_confirmation_mode: false
  operator_warning_acknowledged: '2026-11-15 (Tony was told auto-approve lets agents run any command on ChaosCentral)'
skills:
  - agentcore-project-lifecycle
  - agentcore-tool-discovery
  - omniroute: [cli-setup, cli-health, omni-inference, omni-combos-routing]
editability:
  global_rules: manual_import
  project_rules: direct_write
  mcp_config: manual_import
# mcp_config is UI/API only because OpenHands encrypts secret fields; LLM profile files may be written directly with env references only.
backup_required: true
validation_required: true
restart_required: true
last_validation_date: unverified
mcp_template_source: renderers/gateway-clients/openhands.json
known_limitations:
- The agent-server REST API (/api/profiles, /api/settings) needs the app session key. Agents must not extract it, so profile activation can also be done in the UI.
- Live settings.json is about 1 MB. The running GUI may overwrite file edits. Restart OpenHands after file changes.
- Must never run against nfa-platform or NFA runtimes unless a separate task authorizes it (excluded root).
